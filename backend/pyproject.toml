[project]
name = "transit-replan-lab"
version = "2.0.0"
description = "A timetable-backed simulator for coordinating two riders during transit disruptions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "langchain-ollama>=1,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "numpy>=2.2,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-sdk>=1.39,<2",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "structlog>=25,<27",
    "uvicorn>=0.40,<1",
]

[project.scripts]
trl = "trl.cli:main"


[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trl"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "C90", "BLE", "ASYNC", "S", "PLR0913", "PLR0915", "TRY", "PT"]
# TRY003 and PT018 are stylistic; S311 flags the seeded simulation randomness.
ignore = ["TRY003", "PT018", "S311"]
# Turkish notices use the dotless i as a distinct letter.
allowed-confusables = ["ı"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Tests, tooling and experiments assert freely and call git and local model tools.
"tests/**" = ["S101", "S603", "S607"]
"tests/label_search_oracle.py" = ["C901", "PLR0913", "PLR0915"]
"../scripts/**" = ["S101", "S603", "S607"]
"../experiments/**" = ["S101", "S603", "S607"]
"../finetune/**" = ["S101", "S603", "S607"]
# Ratchet: each entry names the v2 phase that rewrites the function and removes the ignore.
"src/trl/api/app.py" = ["C901", "PLR0915"]        # F2 route modules
"src/trl/negotiation.py" = ["C901", "BLE001"]     # F2 error taxonomy
"src/trl/orchestration.py" = ["C901"]             # F5 intake split out of the worker
"src/trl/intake.py" = ["C901"]                    # F5 language package
"src/trl/language/*.py" = ["RUF001", "RUF003"]   # Turkish and typographic punctuation is the input
"src/trl/language/timeexpr.py" = ["C901"]        # one pass per grammar rule, covered by round trips
"src/trl/routing.py" = ["C901", "PLR0913", "PLR0915"]  # F6 routing v2
"../experiments/runner.py" = ["ASYNC240", "PLR0915"]      # F7 bench v3 runner
"../experiments/vnext_cases.py" = ["C901", "PLR0915"]     # F7 bench v3 generator
"../experiments/vnext_mediation.py" = ["ASYNC240", "PLR0915"]
"../experiments/vnext_runner.py" = ["ASYNC240", "PLR0913"]
"../finetune/data.py" = ["PLR0913"]                       # F8 training data v2
"../finetune/routes.py" = ["ASYNC240"]

[tool.pyright]
include = ["src", "tests", "../scripts", "../experiments", "../finetune/data.py", "../finetune/routes.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["src", ".."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "ollama: requires a running local Ollama instance",
    "deep: long property and differential suites for the nightly job",
]

[tool.coverage.run]
branch = true
source = ["trl"]
omit = ["*/trl/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "trl"

[[tool.importlinter.contracts]]
name = "Routing and verification are independent"
type = "independence"
modules = ["trl.routing", "trl.verifier"]

[[tool.importlinter.contracts]]
name = "The verifier never reads router state or the router's overlay"
type = "forbidden"
source_modules = ["trl.verifier"]
forbidden_modules = ["trl.routing", "trl.disruptions", "trl.robustness", "trl.verify"]

[[tool.importlinter.contracts]]
name = "The timetable core is below application and HTTP"
type = "layers"
layers = [
    "trl.api",
    "trl.routing | trl.verify",
    "trl.verifier",
    "trl.gtfs | trl.disruptions",
    "trl.domain",
]
