[project]
name = "transit-replan-lab"
version = "0.1.0"
description = "A timetable-backed simulator for coordinating two riders during transit disruptions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "langchain-ollama>=1,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "pydantic>=2.12,<3",
    "structlog>=25,<27",
    "uvicorn>=0.40,<1",
]

[project.scripts]
trl = "trl.cli:main"


[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trl"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pyright]
include = ["src", "tests", "../scripts", "../experiments", "../finetune/data.py", "../finetune/routes.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["src", ".."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["ollama: requires a running local Ollama instance"]

[tool.importlinter]
root_package = "trl"

[[tool.importlinter.contracts]]
name = "Routing and verification are independent"
type = "independence"
modules = ["trl.routing", "trl.verify"]

[[tool.importlinter.contracts]]
name = "The timetable core is below application and HTTP"
type = "layers"
layers = [
    "trl.api",
    "trl.routing | trl.verify",
    "trl.gtfs | trl.disruptions",
    "trl.domain",
]
