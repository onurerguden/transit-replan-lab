[project]
name = "transit-replan-lab"
version = "0.1.0"
description = "A timetable-backed simulator for coordinating two riders during transit disruptions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.12,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trl"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["../scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pyright]
include = ["src", "tests", "../scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = ["ollama: requires a running local Ollama instance"]
