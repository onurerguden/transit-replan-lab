train: true
fine_tune_type: lora
data: .local/finetune/data
adapter_path: .local/finetune/pilot
seed: 42
batch_size: 1
num_layers: 4
iters: 25
learning_rate: 0.0001
max_seq_length: 384
steps_per_eval: 25
steps_per_report: 5
save_every: 25
val_batches: 4
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.v_proj]
