train: true
fine_tune_type: lora
data: .local/finetune/training
adapter_path: .local/finetune/adapter
seed: 42
batch_size: 1
num_layers: 4
iters: 360
learning_rate: 0.0001
max_seq_length: 384
steps_per_eval: 120
steps_per_report: 20
save_every: 120
val_batches: 12
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.0
  keys: [self_attn.q_proj, self_attn.v_proj]
