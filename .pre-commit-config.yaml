repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --project backend ruff check backend scripts experiments finetune
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --project backend ruff format --check backend scripts experiments finetune
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: Pyright strict
        entry: uv run --locked --project backend pyright --project backend/pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: Frontend lint
        entry: sh -c 'cd frontend && corepack pnpm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: public-files
        name: Public boundary for staged files
        entry: uv run --locked --project backend python scripts/check_public_boundary.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: public-message
        name: Public boundary for commit messages
        entry: uv run --locked --project backend python scripts/check_public_boundary.py --message-file
        language: system
        stages: [commit-msg]
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
